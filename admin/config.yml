backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "berita"
    label: "Berita & Rilisan"
    folder: "content/berita"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Judul Berita", name: "title", widget: "string" }
      - { label: "Tanggal Publish", name: "date", widget: "datetime" }
      - { label: "Foto Utama", name: "thumbnail", widget: "image" }
      - {
          label: "Link Streaming / Lagu (Spotify/YouTube)",
          name: "song_link",
          widget: "string",
          required: false,
        }
      - {
          label: "Upload File Audio (MP3/WAV)",
          name: "audio_file",
          widget: "file",
          required: false,
        }
      - { label: "Isi Berita", name: "body", widget: "markdown" }
